run: docker compose up --build
seed: docker compose run --rm seed
test: docker compose run --rm api pytest -q
base_url: http://localhost:8000
endpoints:
  - GET /health
  - POST /v1/jobs/catalog
  - GET /v1/jobs/{job_id}
  - POST /v1/posts
  - GET /v1/posts/{post_id}/images
  - GET /v1/suggestions/{suggestion_id}
  - PUT /v1/suggestions/{suggestion_id}/review
  - GET /v1/costs

